name: Class A validator

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Synthetic example conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Class A example validator
        run: python tools/validate_class_a_examples.py --self-test
