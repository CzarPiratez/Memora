name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-app-boundaries:
    name: Core / App layer boundary guards
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run application layer boundary checks
        run: bash scripts/check-application-layer-boundaries.sh

      - name: Run domain layer purity checks
        run: bash scripts/check-domain-layer-purity.sh

  legacy-recall-surface:
    name: Legacy recall surface guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run legacy recall surface checks
        run: bash scripts/check-legacy-recall-surface.sh

  unit-tests:
    name: Android unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MemoraApp
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: MemoraApp/**/*.gradle*

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run debug unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
